
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanner Row — Everyday Essentials</title>
    <meta name="theme-color" content="#fbf8f4">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <span>Tanner Row</span>
            </div>

            <div class="search-bar">
                <div class="search-icon">🔍</div>
                <div class="search-input">
                    <input type="search" id="search" placeholder="Search bags, shoes, wallets..." oninput="showProducts()">
                </div>
            </div>

            <ul>
                <li><a href="#shop">Shop</a></li>
                <li>
                    <button class="cart-icon" onclick="openCart()" aria-label="Open shopping cart">
                        🛒<b id="cart-count">0</b>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <aside class="filters">
            <h2>Filters</h2>

            <label for="category">Category</label>
            <select id="category" onchange="showProducts()">
                <option value="All">All Categories</option>
                <option value="Bags">Bags</option>
                <option value="Shoes">Shoes</option>
                <option value="Wallets">Wallets</option>
                <option value="Accessories">Accessories</option>
            </select>

            <label for="max-price">
                Max Price: <b id="price-value">₹10,000</b>
            </label>

            <input type="range" id="max-price" min="500" max="10000" step="500" value="10000" oninput="showProducts()">

            <button class="clear-btn" onclick="clearFilters()">Clear Filters</button>
        </aside>

        <section class="products" id="shop">
            <div class="products-top">
                <div class="products-heading">
                    <h2>Curated essentials</h2>
                    <p>Timeless pieces, made for every day.</p>
                </div>

                <select id="sort" onchange="showProducts()">
                    <option value="default">Sort by</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="name">Name: A to Z</option>
                </select>
            </div>

            <div class="product-list" id="product-list"></div>
        </section>
    </main>

    <div class="overlay" id="overlay" onclick="closeCart()"></div>

    <section class="cart" id="cart">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-btn" onclick="closeCart()" aria-label="Close cart">✖</button>
        </div>

        <div class="cart-items" id="cart-items"></div>

        <div class="cart-bottom">
            <div class="coupon">
                <input type="text" id="coupon-code" placeholder="Enter coupon code">
                <button onclick="applyCoupon()">Apply</button>
            </div>

            <p id="coupon-message">Try SAVE10 or SAVE20</p>

            <div class="bill">
                <p>Subtotal <b id="subtotal">₹0</b></p>
                <p>Discount <b id="discount">- ₹0</b></p>
                <p>Shipping <b id="shipping">₹0</b></p>
                <p class="total">Total <b id="total">₹0</b></p>
            </div>

            <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
        </div>
    </section>

    <div class="checkout" id="checkout">
        <div class="checkout-box">
            <h2>Checkout</h2>

            <input type="text" id="cust-name" placeholder="Full Name">
            <input type="email" id="cust-email" placeholder="Email Address">
            <input type="text" id="cust-phone" placeholder="Phone Number">
            <input type="text" id="cust-address" placeholder="Delivery Address">

            <select id="payment">
                <option value="UPI">UPI</option>
                <option value="Card">Debit / Credit Card</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
            </select>

            <p class="pay-amount">Amount to pay: <b id="checkout-total">₹0</b></p>
            <p id="checkout-message"></p>

            <div class="checkout-buttons">
                <button class="cancel-btn" id="cancel-btn" onclick="closeCheckout()">Cancel</button>
                <button class="order-btn" id="order-btn" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
